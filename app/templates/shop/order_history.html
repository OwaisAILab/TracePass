{% extends "base.html" %}{% block title %}Orders · TracePass{% endblock %}{% block content %}<h3>My Orders</h3><table class="table"><thead><tr><th>Order</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody>{% for o in orders %}<tr><td><a href="{{ url_for('shop.order_detail', order_id=o.id) }}">{{ o.order_number }}</a></td><td>{{ o.created_at }}</td><td>{{ o.total_amount }}</td><td>{{ o.status }}</td></tr>{% else %}<tr><td colspan="4">No orders yet.</td></tr>{% endfor %}</tbody></table>{% endblock %}
